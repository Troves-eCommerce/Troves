mutation RemoveCartLines(
    $cartId: ID!,
    $lineIds: [ID!]!,
    $language: LanguageCode!
) @inContext(language: $language) {
    cartLinesRemove(
        cartId: $cartId,
        lineIds: $lineIds
    ) {
        cart {
            ...CartFields
        }

        userErrors {
            field
            message
        }
    }
}
