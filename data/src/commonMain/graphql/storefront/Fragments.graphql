fragment MoneyFields on MoneyV2 {
    amount
    currencyCode
}

# Full cart projection shared by every cart operation (create/add/update/remove/discount/get)
# so a single mapper can rebuild the local cart cache from one round trip.
fragment CartFields on Cart {
    id
    checkoutUrl
    totalQuantity

    buyerIdentity {
        email
    }

    cost {
        subtotalAmount { ...MoneyFields }
        totalAmount { ...MoneyFields }
        totalTaxAmount { ...MoneyFields }
    }

    discountCodes {
        code
        applicable
    }

    discountAllocations {
        discountedAmount { ...MoneyFields }
    }

    lines(first: 50) {
        nodes {
            id
            quantity

            cost {
                totalAmount { ...MoneyFields }
                amountPerQuantity { ...MoneyFields }
            }

            merchandise {
                ... on ProductVariant {
                    id
                    title
                    availableForSale
                    quantityAvailable
                    image { url }
                    price { ...MoneyFields }
                    product {
                        id
                        title
                        vendor
                    }
                }
            }
        }
    }
}

fragment AddressFields on MailingAddress {
    id
    address1
    address2
    city
    province
    provinceCode
    country
    countryCodeV2
    zip
    phone
    firstName
    lastName
    company
}

fragment OrderLineItemFields on OrderLineItem {
    title
    quantity

    variant {
        id
        title
        sku

        product {
            id
            title
            handle
        }

        image {
            id
            url
            altText
        }
    }

    originalTotalPrice {
        ...MoneyFields
    }
}

fragment OrderCoreFields on Order {
    id
    orderNumber
    name

    email
    phone

    processedAt

    financialStatus
    fulfillmentStatus

    currentSubtotalPrice {
        ...MoneyFields
    }

    currentTotalPrice {
        ...MoneyFields
    }

    currentTotalShippingPrice {
        ...MoneyFields
    }

    currentTotalTax {
        ...MoneyFields
    }

    totalPrice {
        ...MoneyFields
    }

    totalRefunded {
        ...MoneyFields
    }

    shippingAddress {
        ...AddressFields
    }

    statusUrl
}