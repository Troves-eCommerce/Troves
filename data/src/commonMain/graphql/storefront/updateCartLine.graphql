mutation UpdateCartLines(
    $cartId: ID!,
    $lines: [CartLineUpdateInput!]!,
    $language: LanguageCode!
) @inContext(language: $language) {
    cartLinesUpdate(
        cartId: $cartId,
        lines: $lines
    ) {
        cart {
            ...CartFields
        }

        userErrors {
            field
            message
        }
    }
}
