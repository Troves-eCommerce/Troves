query CartEstimatedCost($id: ID!) {
    cart(id: $id) {
        id
        cost {
            totalAmount {
                ...MoneyFields
            }
            subtotalAmount {
                ...MoneyFields
            }
            totalTaxAmount {
                ...MoneyFields
            }
            totalDutyAmount {
                ...MoneyFields
            }
        }
    }
}
