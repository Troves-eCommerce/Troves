mutation UpdateDiscountCodes(
    $cartId: ID!,
    $discountCodes: [String!]!,
    $language: LanguageCode!
) @inContext(language: $language) {
    cartDiscountCodesUpdate(
        cartId: $cartId,
        discountCodes: $discountCodes
    ) {
        cart {
            ...CartFields
        }

        userErrors {
            field
            message
        }
    }
}
