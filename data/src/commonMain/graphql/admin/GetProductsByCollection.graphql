query GetProductsByCollection($id: ID!, $first: Int!, $after: String, $sortKey: ProductCollectionSortKeys, $locale: String!) {
    collection(id: $id) {
        id
        title
        products(first: $first, after: $after, sortKey: $sortKey) {
            edges {
                node {
                    id
                    title
                    handle
                    translations(locale: $locale) {
                        key
                        value
                    }
                    featuredImage {
                        url
                        altText
                    }
                    priceRangeV2 {
                        minVariantPrice {
                            amount
                            currencyCode
                        }
                    }
                }
            }
            pageInfo {
                hasNextPage
                endCursor
            }
        }
    }
}