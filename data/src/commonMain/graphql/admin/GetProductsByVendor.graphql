query GetProductsByVendor($first: Int!, $query: String!) {
    products(first: $first, query: $query) {
        edges {
            node {
                id
                title
                vendor
                handle
                featuredImage {
                    url
                    altText
                }
            }
        }
        pageInfo {
            hasNextPage
            endCursor
        }
    }
}
